<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0A192F" />
<title>WEST HOCKEY MT 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-dark:#0A192F;
    --navy:#007BFF;
    --navy-mid:#4D96FF;
    --navy-soft:#A4C8FF;
    --navy-light:#F0F5FF;
    --bg:#F9F9F9;
    --card:#FFFFFF;
    --line:#F0F0F0;
    --line-2:#D0D0D0;
    --text:#222222;
    --text-2:#5D5D5D;
    --text-3:#999999;
    --success:#0D9974;
    --negative:#FB2D36;
    --notice:#FFCC00;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;
    font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    overscroll-behavior:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

  /* === 공통 레이아웃 === */
  .app{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    background:var(--bg);
  }
  .topbar{
    flex-shrink:0;
    height:44px;
    background:var(--navy-dark);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    padding:0 16px;
    position:relative;
    z-index:10;
  }
  .topbar .title{
    font-weight:900;
    font-size:15px;
    letter-spacing:0.5px;
  }
  .topbar .title .accent{color:var(--navy);}
  .topbar .back{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;color:#fff;
    transition:background .15s;
  }
  .topbar .back:active{background:rgba(255,255,255,0.15);}
  .topbar .back.hidden{display:none;}
  .topbar .timer{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    background:#fff;color:var(--navy-dark);
    min-width:62px;height:32px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;gap:4px;
    font-weight:900;font-size:16px;
    padding:0 12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }
  .topbar .timer.warn{background:var(--negative);color:#fff;animation:pulse 0.5s infinite alternate;}
  .topbar .timer.hidden{display:none;}
  @keyframes pulse{from{transform:translateY(-50%) scale(1);}to{transform:translateY(-50%) scale(1.08);}}

  /* 하단 네이비 시그니처 바 */
  .signature-bar{
    flex-shrink:0;
    height:4px;
    background:var(--navy);
  }

  /* === 화면 컨테이너 === */
  .screen{
    flex:1;
    overflow:hidden;
    position:relative;
    display:none;
  }
  .screen.active{display:flex;}
  .screen-inner{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding:16px;
    display:flex;
    flex-direction:column;
  }

  /* === 메인 화면 === */
  #screen-home .screen-inner{
    align-items:center;justify-content:center;
    flex-direction:row;
    gap:16px;
    padding:16px 24px;
  }
  .home-card{
    flex:1;
    max-width:340px;
    height:80%;
    max-height:300px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:24px;
    position:relative;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(10,25,47,0.06);
    transition:transform .15s, box-shadow .15s;
  }
  .home-card:active{transform:scale(0.97);box-shadow:0 2px 8px rgba(10,25,47,0.08);}
  .home-card.featured{
    background:linear-gradient(135deg, #FFFFFF 0%, var(--navy-light) 100%);
    border:1px solid var(--navy-soft);
  }
  .home-card.disabled{opacity:0.55;}
  .home-card.disabled:active{transform:none;}
  .home-card .emoji{font-size:48px;margin-bottom:12px;}
  .home-card .label-small{
    font-size:13px;color:var(--text-2);font-weight:500;
    margin-bottom:2px;
  }
  .home-card .label-big{
    font-size:26px;font-weight:900;color:var(--text);
    line-height:1.2;text-align:center;
  }
  .home-card .label-big.blue{color:var(--navy);}
  .home-card .ribbon{
    position:absolute;top:10px;right:-28px;
    background:var(--navy);color:#fff;
    font-size:10px;font-weight:700;
    padding:3px 32px;transform:rotate(35deg);
    letter-spacing:0.5px;
  }
  .home-card .ribbon.gray{background:var(--text-3);}
  .home-card .corner-dot{
    position:absolute;bottom:14px;right:14px;
    width:8px;height:8px;border-radius:50%;
    background:var(--navy);
  }

  /* === 카테고리 선택 === */
  #screen-category .screen-inner{padding:14px 16px;}
  .category-header{
    margin-bottom:12px;text-align:center;
  }
  .category-header h2{
    font-size:18px;font-weight:900;color:var(--text);
    margin-bottom:2px;
  }
  .category-header p{
    font-size:11px;color:var(--text-3);
  }
  .category-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    padding-bottom:8px;
  }
  .cat-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 10px;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:6px;
    aspect-ratio:1.5;
    position:relative;
    transition:transform .12s, border-color .12s;
  }
  .cat-card:active{transform:scale(0.95);}
  .cat-card .cat-emoji{font-size:28px;}
  .cat-card .cat-name{
    font-size:15px;font-weight:900;color:var(--text);
  }
  .cat-card .cat-stars{
    font-size:10px;color:var(--notice);
    letter-spacing:1px;
  }
  .cat-card .cat-count{
    position:absolute;top:6px;right:8px;
    font-size:9px;color:var(--text-3);font-weight:700;
  }

  /* === START 화면 === */
  #screen-start .screen-inner{
    align-items:center;justify-content:center;
    padding:20px;
  }
  .start-panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:24px 28px;
    width:100%;max-width:480px;
    text-align:center;
    box-shadow:0 4px 24px rgba(10,25,47,0.08);
  }
  .start-emoji{font-size:42px;margin-bottom:6px;}
  .start-cat-name{
    font-size:22px;font-weight:900;color:var(--text);
    margin-bottom:4px;
  }
  .start-cat-stars{
    font-size:13px;color:var(--notice);
    margin-bottom:14px;
    letter-spacing:2px;
  }
  .start-rules{
    background:var(--navy-light);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:16px;
    font-size:12px;line-height:1.55;
    color:var(--text);text-align:left;
  }
  .start-rules .rule-row{display:flex;align-items:flex-start;gap:6px;margin:2px 0;}
  .start-rules .rule-row b{color:var(--navy);font-weight:700;}
  .start-btn{
    background:var(--navy);
    color:#fff;
    font-weight:900;
    font-size:24px;
    padding:14px 60px;
    border-radius:999px;
    letter-spacing:2px;
    box-shadow:0 6px 20px rgba(0,123,255,0.35);
    transition:transform .12s, box-shadow .12s;
  }
  .start-btn:active{
    transform:scale(0.95);
    box-shadow:0 3px 10px rgba(0,123,255,0.3);
  }

  /* === 카운트다운 === */
  #screen-countdown{
    display:none;
    position:absolute;inset:0;
    background:rgba(10,25,47,0.98);
    z-index:50;
    align-items:center;justify-content:center;
  }
  #screen-countdown.active{display:flex;}
  .countdown-num{
    font-size:140px;font-weight:900;color:#fff;
    line-height:1;
    animation:countdownAnim 1s ease-out;
  }
  .countdown-num.go{color:var(--navy-mid);font-size:90px;}
  @keyframes countdownAnim{
    0%{transform:scale(0.4);opacity:0;}
    40%{transform:scale(1.1);opacity:1;}
    100%{transform:scale(1);opacity:1;}
  }

  /* === 게임 화면 === */
  #screen-game .screen-inner{padding:0;}
  .game-wrap{
    flex:1;
    display:flex;flex-direction:column;
    position:relative;
    padding:12px 16px 16px;
    overflow:hidden;
  }
  .game-meta{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;
    flex-shrink:0;
  }
  .game-meta .cat-pill{
    background:var(--navy-light);
    color:var(--navy);
    font-size:12px;font-weight:700;
    padding:4px 12px;border-radius:999px;
  }
  .game-meta .score{
    font-size:14px;font-weight:900;color:var(--text);
  }
  .game-meta .score .score-num{color:var(--navy);font-size:18px;margin-left:4px;}
  .game-meta .progress{
    font-size:11px;color:var(--text-3);font-weight:700;
  }

  .word-stage{
    flex:1;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    min-height:0;
  }
  .arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    width:44px;height:64px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-3);
    font-size:32px;
    border-radius:8px;
    transition:color .12s, background .12s, transform .12s;
    z-index:2;
  }
  .arrow:active{
    background:var(--navy-light);
    color:var(--navy);
    transform:translateY(-50%) scale(0.92);
  }
  .arrow.left{left:0;}
  .arrow.right{right:0;}
  .arrow.disabled{opacity:0.25;pointer-events:none;}

  .word-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:24px 60px;
    min-width:60%;max-width:85%;
    text-align:center;
    box-shadow:0 6px 24px rgba(10,25,47,0.08);
    position:relative;
  }
  .word-card .word-idx{
    font-size:12px;font-weight:700;color:var(--text-3);
    margin-bottom:4px;
    letter-spacing:1px;
  }
  .word-card .word-text{
    font-size:46px;font-weight:900;color:var(--text);
    line-height:1.1;
    word-break:keep-all;
  }
  .word-card.passed-tag::after{
    content:"보류";
    position:absolute;top:8px;right:12px;
    font-size:10px;font-weight:700;color:var(--notice);
    background:#FFFBEB;padding:2px 8px;border-radius:8px;
  }

  .action-row{
    display:flex;gap:10px;
    margin-top:10px;
    flex-shrink:0;
  }
  .action-btn{
    flex:1;
    padding:14px;
    border-radius:14px;
    font-size:18px;font-weight:900;
    transition:transform .1s, box-shadow .1s;
    letter-spacing:1px;
  }
  .action-btn:active{transform:scale(0.96);}
  .action-btn.correct{
    background:var(--success);color:#fff;
    box-shadow:0 4px 12px rgba(13,153,116,0.3);
  }
  .action-btn.pass{
    background:#fff;color:var(--negative);
    border:2px solid var(--negative);
  }

  /* 정답 플래시 */
  .flash{
    position:absolute;inset:0;
    pointer-events:none;
    z-index:30;
    opacity:0;
  }
  .flash.show{animation:flashAnim 0.5s ease-out;}
  .flash.correct{background:radial-gradient(circle at center, rgba(13,153,116,0.4) 0%, transparent 70%);}
  .flash.pass{background:radial-gradient(circle at center, rgba(251,45,54,0.25) 0%, transparent 70%);}
  @keyframes flashAnim{
    0%{opacity:0;}30%{opacity:1;}100%{opacity:0;}
  }

  /* === 종료 화면 === */
  #screen-end .screen-inner{padding:14px 16px;}
  .end-layout{display:flex;flex-direction:column;flex:1;min-height:0;}
  .end-left{display:contents;}
  .end-right{display:contents;}
  .end-hero{
    text-align:center;
    background:var(--navy-dark);
    color:#fff;
    border-radius:18px;
    padding:18px 16px;
    margin-bottom:12px;
    position:relative;overflow:hidden;
  }
  .end-hero::before{
    content:"";position:absolute;top:-50%;right:-30%;
    width:200px;height:200px;
    background:radial-gradient(circle, var(--navy) 0%, transparent 70%);
    opacity:0.4;
  }
  .end-hero .end-title{
    font-size:14px;font-weight:700;color:var(--navy-soft);
    margin-bottom:6px;letter-spacing:1px;
    position:relative;
  }
  .end-hero .end-score{
    font-size:52px;font-weight:900;color:#fff;
    line-height:1;
    position:relative;
  }
  .end-hero .end-score .unit{
    font-size:20px;color:var(--navy-soft);margin-left:4px;
  }
  .end-hero .end-detail{
    font-size:12px;color:var(--navy-soft);
    margin-top:6px;position:relative;
  }
  .end-hero .end-bonus{
    display:inline-block;
    background:var(--navy);
    color:#fff;
    font-size:11px;font-weight:700;
    padding:3px 10px;border-radius:999px;
    margin-top:6px;
    position:relative;
  }
  .end-hero .early-badge{
    display:inline-block;
    background:var(--notice);
    color:var(--text);
    font-size:11px;font-weight:900;
    padding:3px 10px;border-radius:999px;
    margin-top:6px;margin-right:4px;
    position:relative;
  }

  .end-section{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .end-section h3{
    font-size:13px;font-weight:900;color:var(--text);
    margin-bottom:8px;
    display:flex;align-items:center;gap:6px;
  }
  .end-section h3 .badge{
    font-size:10px;color:#fff;
    background:var(--text-3);
    padding:1px 6px;border-radius:6px;font-weight:700;
  }
  .end-section h3 .badge.pass-badge{background:var(--negative);}
  .end-section h3 .badge.correct-badge{background:var(--success);}
  .end-list{
    display:flex;flex-wrap:wrap;gap:6px;
  }
  .end-list .chip{
    background:var(--navy-light);
    color:var(--navy);
    font-size:12px;font-weight:500;
    padding:4px 10px;border-radius:999px;
  }
  .end-list .chip.pass-chip{
    background:#FFEEEF;color:var(--negative);
  }
  .end-list .chip.empty{
    background:transparent;color:var(--text-3);
    padding:4px 0;font-style:italic;
  }
  .end-actions{
    display:flex;gap:8px;margin-top:8px;
  }
  .end-actions button{
    flex:1;padding:12px;
    border-radius:12px;
    font-size:13px;font-weight:900;
    transition:transform .1s;
  }
  .end-actions button:active{transform:scale(0.96);}
  .end-actions .home-btn{
    background:#fff;color:var(--text);
    border:1.5px solid var(--line-2);
  }
  .end-actions .again-btn{
    background:var(--navy);color:#fff;
    box-shadow:0 4px 12px rgba(0,123,255,0.3);
  }

  /* 가로 모드 최적화 (가로 폭 > 세로 폭) */
  @media (orientation: landscape) and (max-height: 500px){
    .topbar{height:38px;}
    .topbar .title{font-size:13px;}
    #screen-home .screen-inner{padding:10px 24px;}
    .home-card{max-height:none;height:88%;}
    .home-card .emoji{font-size:38px;margin-bottom:6px;}
    .home-card .label-big{font-size:22px;}
    .home-card .label-small{font-size:11px;}
    .category-grid{grid-template-columns:repeat(6, 1fr);}
    .cat-card{aspect-ratio:1.1;padding:8px 6px;gap:4px;}
    .cat-card .cat-emoji{font-size:22px;}
    .cat-card .cat-name{font-size:13px;}
    .cat-card .cat-stars{font-size:9px;}
    .start-panel{padding:14px 20px;}
    .start-emoji{font-size:30px;margin-bottom:2px;}
    .start-cat-name{font-size:18px;}
    .start-cat-stars{font-size:11px;margin-bottom:8px;}
    .start-rules{padding:8px 12px;font-size:11px;margin-bottom:10px;}
    .start-btn{font-size:18px;padding:10px 40px;}
    .game-wrap{padding:8px 12px 10px;}
    .game-meta{margin-bottom:6px;}
    .word-card{padding:14px 50px;}
    .word-card .word-text{font-size:36px;}
    .word-card .word-idx{font-size:11px;}
    .action-btn{padding:10px;font-size:15px;}
    .action-row{margin-top:6px;}
    /* 종료 화면: 가로 2단 레이아웃 */
    #screen-end .screen-inner{padding:8px 12px;}
    .end-layout{
      display:grid;
      grid-template-columns:230px 1fr;
      gap:10px;
      flex:1;
      min-height:0;
    }
    .end-left{display:flex;flex-direction:column;}
    .end-right{display:flex;flex-direction:column;gap:6px;overflow-y:auto;}
    .end-hero{
      padding:14px 12px;margin-bottom:8px;
      flex-shrink:0;
    }
    .end-hero .end-title{font-size:12px;margin-bottom:4px;}
    .end-hero .end-score{font-size:34px;}
    .end-hero .end-score .unit{font-size:14px;}
    .end-hero .end-detail{font-size:10px;margin-top:4px;}
    .end-hero .end-bonus,.end-hero .early-badge{
      font-size:9px;padding:2px 8px;margin-top:4px;
    }
    .end-section{padding:8px 10px;margin-bottom:0;}
    .end-section h3{font-size:12px;margin-bottom:6px;}
    .end-list .chip{font-size:11px;padding:3px 8px;}
    .end-actions{margin-top:6px;flex-shrink:0;}
    .end-actions button{padding:10px;font-size:12px;}
    .countdown-num{font-size:100px;}
    .countdown-num.go{font-size:66px;}
  }

  /* 작은 폰 (세로) */
  @media (orientation: portrait){
    #screen-home .screen-inner{flex-direction:column;padding:24px 32px;}
    .home-card{max-width:none;width:100%;max-height:200px;height:auto;padding:32px 20px;}
  }

  /* 회전 안내 */
  .rotate-hint{
    position:fixed;inset:0;
    background:var(--navy-dark);
    color:#fff;
    display:none;
    align-items:center;justify-content:center;
    flex-direction:column;
    z-index:9999;
    padding:32px;text-align:center;
  }
  .rotate-hint .icon{font-size:60px;margin-bottom:16px;animation:rotate 2s ease-in-out infinite;}
  @keyframes rotate{
    0%,100%{transform:rotate(0deg);}50%{transform:rotate(90deg);}
  }
  .rotate-hint h2{font-size:20px;font-weight:900;margin-bottom:8px;}
  .rotate-hint p{font-size:13px;color:var(--navy-soft);}
  @media (orientation: portrait) and (max-width: 480px){
    .rotate-hint{display:flex;}
  }
</style>
</head>
<body>

<div class="rotate-hint">
  <div class="icon">📱</div>
  <h2>가로로 돌려주세요</h2>
  <p>이 게임은 가로 모드에 최적화되어 있어요</p>
</div>

<div class="app">
  <div class="topbar">
    <button class="back hidden" id="backBtn" aria-label="뒤로">←</button>
    <div class="title">WEST HOCKEY MT <span class="accent">2026</span></div>
    <div class="timer hidden" id="timer">60</div>
  </div>

  <!-- 메인 -->
  <div class="screen active" id="screen-home">
    <div class="screen-inner">
      <button class="home-card featured" id="goCategory">
        <div class="emoji">🤸</div>
        <div class="label-big">몸으로</div>
        <div class="label-big blue">말해요</div>
        <div class="corner-dot"></div>
      </button>
      <button class="home-card disabled" id="goSpeed">
        <div class="emoji">🎤</div>
        <div class="label-small">말로 하는</div>
        <div class="label-big">스피드 퀴즈</div>
        <div class="ribbon gray">준비중</div>
      </button>
    </div>
  </div>

  <!-- 카테고리 -->
  <div class="screen" id="screen-category">
    <div class="screen-inner">
      <div class="category-header">
        <h2>카테고리를 선택하세요</h2>
        <p>한 라운드에 카테고리 하나, 15개 제시어 · 60초</p>
      </div>
      <div class="category-grid" id="categoryGrid"></div>
    </div>
  </div>

  <!-- START -->
  <div class="screen" id="screen-start">
    <div class="screen-inner">
      <div class="start-panel">
        <div class="start-emoji" id="startEmoji">🏐</div>

const audioCache = {};
function playSound(name){
  try{
    if(!audioCache[name]){
      audioCache[name] = new Audio(SOUNDS[name]);
      audioCache[name].preload = "auto";
    }
    const a = audioCache[name];
    a.currentTime = 0;
    a.play().catch(()=>{});
  }catch(e){}
}
// 사용자 첫 터치 후 오디오 unlock
function unlockAudio(){
  Object.keys(SOUNDS).forEach(k=>{
    if(!audioCache[k]){
      audioCache[k] = new Audio(SOUNDS[k]);
      audioCache[k].preload = "auto";
    }
    const a = audioCache[k];
    const v = a.volume; a.volume = 0;
    a.play().then(()=>{a.pause();a.currentTime=0;a.volume=v;}).catch(()=>{a.volume=v;});
  });
  document.removeEventListener('touchstart', unlockAudio);
  document.removeEventListener('click', unlockAudio);
}
document.addEventListener('touchstart', unlockAudio, {once:true});
document.addEventListener('click', unlockAudio, {once:true});

function startCountdown(){
  const overlay = document.getElementById('screen-countdown');
  const num = document.getElementById('countdownNum');
  showScreen('game');
  initGame();
  overlay.classList.add('active');

  let n = 3;
  num.textContent = '3';
  num.classList.remove('go');
  playSound('tick');

  const interval = setInterval(()=>{
    n--;
    if(n > 0){
      num.textContent = String(n);
      num.classList.remove('go');
      // 강제 reflow로 애니메이션 재시작
      void num.offsetWidth;
      num.style.animation = 'none';
      void num.offsetWidth;
      num.style.animation = '';
      playSound('tick');
    } else if(n === 0){
      num.textContent = 'GO!';
      num.classList.add('go');
      void num.offsetWidth;
      num.style.animation = 'none';
      void num.offsetWidth;
      num.style.animation = '';
      playSound('go');
    } else {
      clearInterval(interval);
      overlay.classList.remove('active');
      startTimer();
    }
  }, 800);
}

/* ===== 게임 상태 ===== */
let game = null;
function initGame(){
  game = {
    queue: currentCat.words.map((w,i)=>({word:w, originalIdx:i+1})),
    correctList: [],
    passList: [],
    seenInRound: new Set(), // 보류 라벨용
    cursor: 0,
    score: 0,
    timeLeft: 60,
    cycleStart: 0, // 현재 라운드 (큐 한 바퀴) 시작 위치
  };
  // UI
  document.getElementById('gameCat').textContent = `${currentCat.name} ${stars(currentCat.stars)}`;
  document.getElementById('gameScore').textContent = '0';
  renderCurrentWord();
}

function renderCurrentWord(){
  if(game.queue.length === 0){
    // 안전장치 - 모두 맞춤
    finishGame(true);
    return;
  }
  const cur = game.queue[game.cursor];
  document.getElementById('wordText').textContent = cur.word;
  document.getElementById('wordIdx').textContent = `${game.cursor + 1} / ${game.queue.length}`;
  document.getElementById('gameProgress').textContent = `남은 ${game.queue.length}`;
  // 보류 태그
  const card = document.getElementById('wordCard');
  if(game.passList.some(p => p.word === cur.word) || game.seenInRound.has(cur.word)){
    // 한 번 이상 봤던 단어 (재등장)
    if(game.passList.length > 0 && game.passList.some(p => p.word === cur.word)){
      card.classList.add('passed-tag');
    } else {
      card.classList.remove('passed-tag');
    }
  } else {
    card.classList.remove('passed-tag');
  }
  // 화살표 상태 (양 끝)
  document.getElementById('arrowLeft').classList.toggle('disabled', game.queue.length <= 1);
  document.getElementById('arrowRight').classList.toggle('disabled', game.queue.length <= 1);
}

/* ===== 타이머 ===== */
let timerInterval = null;
function startTimer(){
  game.timeLeft = 60;
  const tEl = document.getElementById('timer');
  tEl.classList.remove('hidden','warn');
  tEl.textContent = '60';
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    game.timeLeft--;
    tEl.textContent = String(game.timeLeft);
    if(game.timeLeft <= 10) tEl.classList.add('warn');
    if(game.timeLeft <= 0){
      stopTimer();
      finishGame(false);
    }
  }, 1000);
}
function stopTimer(){
  if(timerInterval){clearInterval(timerInterval);timerInterval = null;}
  document.getElementById('timer').classList.add('hidden');
}

/* ===== 정답/패스/이동 ===== */
function flash(type){
  const el = document.getElementById('flash');
  el.className = `flash ${type}`;
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 500);
}

function handleCorrect(){
  if(!game || game.queue.length === 0) return;
  const cur = game.queue[game.cursor];
  game.correctList.push(cur);
  game.score += 10;
  document.getElementById('gameScore').textContent = String(game.score);
  // passList에 있었다면 제거
  game.passList = game.passList.filter(p => p.word !== cur.word);
  // 큐에서 제거
  game.queue.splice(game.cursor, 1);
  playSound('correct');
  flash('correct');
  if(game.queue.length === 0){
    setTimeout(()=> finishGame(true), 300);
    return;
  }
  // 커서 보정: 마지막을 지웠으면 0으로
  if(game.cursor >= game.queue.length) game.cursor = 0;
  renderCurrentWord();
}

function handlePass(){
  if(!game || game.queue.length === 0) return;
  const cur = game.queue[game.cursor];
  // passList 갱신 (중복 없게)
  if(!game.passList.some(p => p.word === cur.word)){
    game.passList.push(cur);
  }
  // 큐에서 빼서 맨 뒤로 이동
  game.queue.splice(game.cursor, 1);
  game.queue.push(cur);
  playSound('pass');
  flash('pass');
  // 커서 유지 (다음 단어가 자동으로 같은 인덱스에)
  if(game.cursor >= game.queue.length) game.cursor = 0;
  renderCurrentWord();
}

function moveCursor(dir){
  if(!game || game.queue.length <= 1) return;
  game.cursor = (game.cursor + dir + game.queue.length) % game.queue.length;
  renderCurrentWord();
}

document.getElementById('btnCorrect').addEventListener('click', handleCorrect);
document.getElementById('btnPass').addEventListener('click', handlePass);
document.getElementById('arrowLeft').addEventListener('click', ()=> moveCursor(-1));
document.getElementById('arrowRight').addEventListener('click', ()=> moveCursor(1));

// 스와이프 (선택사항: 화면 전체)
let touchStartX = 0;
const stage = document.querySelector('.word-stage');
stage.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', e => {
  if(currentScreen !== 'game') return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){
    moveCursor(dx > 0 ? -1 : 1);
  }
}, {passive:true});

/* ===== 종료 ===== */
function finishGame(isEarly){
  stopTimer();
  const remaining = Math.max(0, game.timeLeft);
  const bonus = isEarly ? remaining : 0;
  const finalScore = game.score + bonus;
  const correctCount = game.correctList.length;
  const totalCount = currentCat.words.length;

  document.getElementById('endTitle').textContent = isEarly ? '🎉 퍼펙트!' : '라운드 종료';
  document.getElementById('endScore').textContent = String(finalScore);
  document.getElementById('endDetail').textContent = `전체 ${totalCount}개 중 ${correctCount}개 정답`;

  const bonusWrap = document.getElementById('endBonusWrap');
  bonusWrap.innerHTML = '';
  if(isEarly){
    bonusWrap.innerHTML = `
      <div class="early-badge">조기 종료</div>
      <div class="end-bonus">기본 ${game.score} + 보너스 ${bonus}</div>
    `;
  }

  // 정답 목록
  const cList = document.getElementById('endCorrectList');
  document.getElementById('endCorrectCnt').textContent = String(correctCount);
  cList.innerHTML = '';
  if(game.correctList.length === 0){
    cList.innerHTML = '<span class="chip empty">없음</span>';
  } else {
    game.correctList.forEach(w => {
      const c = document.createElement('span');
      c.className = 'chip';
      c.textContent = w.word;
      cList.appendChild(c);
    });
  }

  // 패스 목록 (라운드 끝까지 패스로 남은 것 = queue에 남아있고 correctList엔 없는 것)
  // 실제 "끝까지 못 맞힌" 단어들
  const unsolvedWords = game.queue.map(q => q.word);
  const passShown = unsolvedWords.length > 0
    ? unsolvedWords
    : game.passList.filter(p => !game.correctList.some(c => c.word === p.word)).map(p => p.word);
  document.getElementById('endPassCnt').textContent = String(passShown.length);
  const pList = document.getElementById('endPassList');
  pList.innerHTML = '';
  if(passShown.length === 0){
    pList.innerHTML = '<span class="chip empty">없음 (모두 정답!)</span>';
  } else {
    passShown.forEach(w => {
      const c = document.createElement('span');
      c.className = 'chip pass-chip';
      c.textContent = w;
      pList.appendChild(c);
    });
  }

  playSound('end');
  showScreen('end');
}

document.getElementById('goHome').addEventListener('click', ()=> showScreen('home'));
document.getElementById('goAgain').addEventListener('click', ()=>{
  renderCategories();
  showScreen('category');
});

/* ===== 초기 렌더 ===== */
renderCategories();
</script>
</body>
